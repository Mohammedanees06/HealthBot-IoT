<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medicine Search</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.5s ease;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            height: 600px;
            max-width: 900px;
            transition: background-color 0.5s ease, box-shadow 0.3s ease;
            box-sizing: border-box;
        }

        h2 {
            color: #000000;
            margin-bottom: 30px;
            transition: color 0.3s ease;
            font-size: 2.2rem;
        }

        input[type="text"] {
            width: calc(100% - 140px);
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-right: 15px;
            font-size: 18px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            outline: none;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border-color: #000000;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        button {
            padding: 15px 30px;
            background-color: #000000;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.3s ease, transform 0.1s ease, box-shadow 0.3s ease;
            outline: none;
        }

        button:hover {
            background-color: #217dbb;
            transform: scale(1.05);
        }

        button:active {
            background-color: #196195;
            transform: scale(0.95);
        }

        #resultBox {
            margin-top: 40px;
            padding: 25px;
            border: 1px solid #eee;
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.9);
            text-align: left;
            font-size: 18px;
            line-height: 1.8;
            transition: border-color 0.3s ease, background-color 0.5s ease, box-shadow 0.3s ease;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.05);
        }

        #resultBox p {
            margin-bottom: 15px;
            color: #666;
        }

        #resultBox p strong {
            color: #2c3e50;
        }

        @media (max-width: 768px) {
            .container {
                width: 95%;
                padding: 20px;
            }

            h2 {
                font-size: 2rem;
            }

            input[type="text"] {
                width: 100%;
                margin-right: 0;
                margin-bottom: 15px;
                padding: 12px;
                font-size: 16px;
            }

            button {
                width: 100%;
                padding: 12px 25px;
                font-size: 16px;
            }

            #resultBox {
                margin-top: 30px;
                padding: 20px;
                font-size: 16px;
                line-height: 1.6;
            }
        }

        body.dark-mode {
            background-color: #121212;
        }

        body.dark-mode .container {
            background-color: #1f1f1f;
            border-color: #444;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        body.dark-mode h2 {
            color: #3498db;
        }

        body.dark-mode input[type="text"] {
            background-color: #2a2a2a;
            border-color: #555;
            color: #eee;
        }

        body.dark-mode input[type="text"]:focus {
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        body.dark-mode button {
            background-color: #3498db;
            color: #fff;
        }

        body.dark-mode button:hover {
            background-color: #217dbb;
        }

        body.dark-mode button:active {
            background-color: #196195;
        }

        body.dark-mode #resultBox {
            background-color: #2a2a2a;
            border-color: #555;
            color: #eee;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        body.dark-mode #resultBox p {
            color: #ddd;
        }

        body.dark-mode #resultBox p strong {
            color: #fff;
        }
        .back-button {
    position: absolute;
    top: 20px;
    left: 30px;
    padding: 10px 20px;
    background-color: #111;
    color: #fff;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    font-size: 14px;
}

.back-button:hover {
    background-color: #00BFFF;
}

    </style>
</head>
<body>
    <button onclick="history.back()" class="back-button">← Back</button>

    <div class="container">
        <h2>🔍 Medicine Information</h2>
        <input type="text" id="searchInput" placeholder="Enter medicine name..."/>
        <button id="searchBtn">Search</button>
        <div id="resultBox"></div>
    </div>
    <script src="medic.js"></script>
</body>
</html>
