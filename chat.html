    <div id="chatBot" class="chatBot">
      <header>
        <h2>ChatBOT</h2>
      </header>
      <ul class="chatbox">
        <li class="chat-incoming chat">
          <p>Hey! How can I assist you today?</p>
        </li>
        <div id="faq-section">
          <h3>Common Questions</h3>
          <ul id="faq-list"></ul>
        </div>
      </ul>

      <div class="chat-input">
        <textarea
          rows="0"
          cols="17"
          placeholder="Enter a message..."
        ></textarea>

        <!-- Wrap all buttons inside a container -->
        <div class="chat-buttons">
          <button id="sendBTN">Send</button>
          <button id="saveBTN">Save Chat</button>
          <button id="clearChatBtn">Clear Chat</button>
          <button id="generateReportButton">Gen Report</button>
        </div>
      </div>
    </div>
