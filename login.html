<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #ffffff;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: #1e1e1e;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
      width: 320px;
      text-align: center;
    }

    h2 {
      color: #ffffff;
    }

    input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #333;
      background-color: #2c2c2c;
      color: #ffffff;
      border-radius: 6px;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: #ffffff;
    }

    button {
      width: 95%;
      padding: 12px;
      margin-top: 15px;
      background-color: #ffffff;
      color: #000000;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #dddddd;
    }

    #errorMsg {
      color: #ff4c4c;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
      <p id="errorMsg"></p>
    </form>
  </div>

  <script>
    // Check if user is already logged in
    if (localStorage.getItem("isLoggedIn") === "true") {
      window.location.href = "index.html"; // Redirect directly to index.html
    }

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();

     const errorMsg = document.getElementById("errorMsg");
const username = document.getElementById("username").value.trim();
const password = document.getElementById("password").value.trim();

     const credentials = {
  user: "anees1234",       // user -> index.html
  doctor: "doctor1234"     // doctor -> doctor.html
};

if (credentials[username] && credentials[username] === password) {
  localStorage.setItem("isLoggedIn", "true");
  localStorage.setItem("userRole", username); // Optional: track who logged in

  if (username === "user") {
    window.location.href = "index.html";
  } else if (username === "doctor") {
    window.location.href = "doctor.html";
  }
} else {
  errorMsg.textContent = "Invalid username or password.";
}
    });
  </script>
</body>
</html>
